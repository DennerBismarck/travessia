app = "travessia-hodle"
primary_region = "gru"

[build.args]
  PUBLIC_BASE_URL = "https://travessia-hodle.fly.dev"

[env]
  HODLE_API_URL = "https://sandbox-api.hodle.com.br"
  PUBLIC_BASE_URL = "https://travessia-hodle.fly.dev"
  DATABASE_PATH = "/data/travessia.sqlite"
  DAILY_RUN_CAP = "200"
  PIX_KEY_DEMO = "recebedor@example.com"

[[mounts]]
  source = "travessia_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health?shallow=1"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
